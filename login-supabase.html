<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zoblox — Supabase login preview</title>
<style>body{font:16px system-ui;background:#121317;color:white;min-height:100vh;display:grid;place-items:center;margin:0}main{background:#24262e;padding:28px;border-radius:14px;width:min(400px,90vw)}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}input{background:#17181d;color:white;border:1px solid #777}button{margin-top:20px;background:#00b06f;color:white;border:0;font-weight:bold}button:disabled{opacity:.5}#status{min-height:2em;white-space:pre-wrap}a{color:#8ab4ff}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script></head>
<body><main><h1>Zoblox — Log in</h1><p>Supabase preview. The main game is not connected yet.</p>
<form id="login"><label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required>
<button id="submit" type="submit">Log in</button></form><p id="status" role="status" aria-live="polite"></p>
<button id="logout" type="button" hidden>Log out</button>
<p><a href="./auth-supabase.html">Create account</a> · <a href="./index.html">Back to game</a></p></main>
<script>
(function(){
'use strict';
const client=window.zobloxSupabase,status=document.getElementById('status'),form=document.getElementById('login'),logout=document.getElementById('logout'),submit=document.getElementById('submit');
if(!client){status.textContent='Authentication is temporarily unavailable.';submit.disabled=true;return;}
function display(session){form.hidden=!!session;logout.hidden=!session;status.textContent=session?'You are signed in. The main game is not yet connected.':'You are signed out.';}
client.auth.getSession().then(({data,error})=>{if(error)status.textContent='Unable to restore session.';else display(data.session);}).catch(()=>status.textContent='Unable to restore session.');
client.auth.onAuthStateChange((_event,session)=>display(session));
form.addEventListener('submit',async function(e){
e.preventDefault();const username=document.getElementById('username').value.trim(),password=document.getElementById('password').value;
if(!/^[A-Za-z0-9_]{3,20}$/.test(username)||password.length<8){status.textContent='Check your username and password.';return;}
submit.disabled=true;status.textContent='Signing in…';
try{
const response=await fetch('https://vaxmbrdgitemezgmrbfw.supabase.co/functions/v1/username-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_zTqgXWJdjFHtqKmqQ6DyRA_G6bVKH3b'},body:JSON.stringify({username,password}),cache:'no-store'});
const result=await response.json();
if(!response.ok){status.textContent=response.status===429?'Too many attempts. Please try again later.':response.status===401?'Invalid username or password.':'Login is temporarily unavailable.';return;}
if(!result.access_token||!result.refresh_token)throw Error('Missing session');
const {error}=await client.auth.setSession({access_token:result.access_token,refresh_token:result.refresh_token});
if(error)throw error;
display((await client.auth.getSession()).data.session);
}catch(_){status.textContent='Login is temporarily unavailable.';}finally{submit.disabled=false;}
});
logout.addEventListener('click',async function(){logout.disabled=true;try{const {error}=await client.auth.signOut();if(error)throw error;display(null);}catch(_){status.textContent='Unable to log out. Please retry.';}finally{logout.disabled=false;}});
})();
</script></body></html>
