# Deploys this repository to Dplooy on every push.
# Added from the Dplooy dashboard (project -> GitHub -> Build).
# Delete this file to turn the pipeline off.
# Installed: 2026-11-18T23:30:18.736Z
name: Deploy to Dplooy

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: echo "Static HTML site - no build required; publish repository root"

      - name: Package build output
        run: |
          cd "."
          zip -r "$GITHUB_WORKSPACE/dplooy-deploy.zip" . -x ".git/*" ".github/*" "node_modules/*" ".env" ".env.*"

      - name: Deploy to Dplooy
        run: |
          curl --fail-with-body -sS -X POST "https://api.dplooy.com/api/v1/deploy/zip" \
            -H "Authorization: Bearer ${{ secrets.DPLOOY_API_KEY }}" \
            -F "file=@dplooy-deploy.zip;type=application/zip" \
            -F "name=mathproblems"
