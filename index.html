<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zoblox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@800&family=Nunito:wght@600;700;800&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: Roblox-style dark home. Sticky top bar, horizontally scrolling rows (Friends, Items Picked For You, Recommended For You),
   a full-window game player layer, and a landing/sign-up screen over a tilted tile collage. Dark by design. */
:root{
  --bg:#121317;--fg:#f7f7f8;--accent:#2d7bff;--green:#00b06f;--red:#e5384f;--gold:#ffc83d;
  --surface:color-mix(in srgb,var(--bg) 92%,var(--fg) 8%);
  --surface2:color-mix(in srgb,var(--bg) 84%,var(--fg) 16%);
  --line:color-mix(in srgb,var(--bg) 85%,var(--fg) 15%);
  --muted:color-mix(in srgb,var(--fg) 62%,var(--bg));
  --font:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Outfit','Figtree',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg{display:block}

/* ---------- buttons / inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700;text-decoration:none;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--surface2) 80%,var(--fg) 20%)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.inp{width:100%;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 14px;outline:none}
.inp:focus{border-color:var(--accent)}
.coin{width:1.1em;height:1.1em;flex:none;color:var(--gold)}

/* ---------- avatars ---------- */
.av{position:relative;display:block;border-radius:50%;overflow:hidden;background:#25262c;flex:none}
.av svg{width:100%;height:100%}
.dot{position:absolute;right:5%;bottom:5%;width:16%;height:16%;min-width:10px;min-height:10px;border-radius:50%;background:#2ed573;border:3px solid var(--bg);box-sizing:content-box}

/* ---------- auth (landing + sign up + log in) ---------- */
.auth{position:fixed;inset:0;z-index:50;overflow:auto;background:#101114;display:flex;flex-direction:column;align-items:center;padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#fff}
.collage{position:fixed;inset:-25%;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;transform:rotate(-14deg);z-index:0;pointer-events:none}
.collage i{display:block;border-radius:22px;overflow:hidden;min-height:150px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.collage svg{width:100%;height:100%}
.shade{position:fixed;inset:0;z-index:1;background:linear-gradient(rgba(16,17,20,.55),rgba(16,17,20,.35) 40%,rgba(16,17,20,.78));pointer-events:none}
.auth>.in{position:relative;z-index:2;width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;align-items:center}
.word{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,68px);letter-spacing:.04em;line-height:1;margin-top:10px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.word svg{width:.86em;height:.86em}
.auth .spacer{flex:1}
.auth .stack{width:100%;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.abtn{height:54px;border-radius:9px;font-weight:700;font-size:17px;border:2px solid rgba(255,255,255,.55);background:transparent;color:#fff;width:100%}
.abtn.white{background:#fff;color:#15161a;border-color:#fff}
.legal{display:flex;gap:10px;justify-content:center;font-weight:700;margin-top:4px}
.legal button{background:none;border:0;color:#6fb1ff;text-decoration:underline;padding:4px;font-weight:700}
.offnote{font-size:12.5px;text-align:center;color:#d5d7de;background:rgba(0,0,0,.35);border-radius:8px;padding:8px 10px}
.panel{width:100%;margin-top:22px;background:rgba(255,255,255,.9);color:#1c1d21;border-radius:10px;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.panel h1{margin:0 0 16px;text-align:center;font-size:20px;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.panel label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;color:#2b2d33}
.panel .inp{background:#fff;color:#1c1d21;border:1px solid #b9bcc4;height:46px}
.panel .hint{font-size:12px;color:#5a5d66;margin:3px 0 0}
.panel .err{color:#c42036;font-size:13.5px;font-weight:600;min-height:1.2em;margin-top:10px}
.panel .go{width:100%;height:46px;margin-top:8px;border:0;border-radius:8px;background:#00b06f;color:#fff;font-weight:800;font-size:16px}
.panel .go:disabled{opacity:.6}
.panel .fine{font-size:12px;color:#444750;margin:14px 0 4px;line-height:1.45}
.panel .fine button{background:none;border:0;color:#0a6bd8;text-decoration:underline;padding:0;font-size:12px}
.panel .swap{display:block;text-align:center;margin-top:12px;background:none;border:0;color:#0a6bd8;font-weight:700}
.panel .back{background:none;border:0;color:#4a4d57;font-weight:700;padding:0;margin-bottom:6px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.swatches button[aria-pressed="true"]{border-color:#1c1d21;box-shadow:0 0 0 2px #fff inset}

/* ---------- app shell ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topin{display:flex;align-items:center;gap:14px;height:58px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.05em;background:none;border:0;padding:0}
.logo svg{width:30px;height:30px}
.nav{display:flex;gap:4px}
.nav button{background:none;border:0;height:36px;padding:0 12px;border-radius:8px;font-weight:700;color:var(--muted)}
.nav button:hover{background:var(--surface2);color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg)}
.search{position:relative;flex:1;min-width:0;max-width:520px}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--bg);padding:0 14px 0 40px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:13px;top:11px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:18px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.avbtn{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid var(--line);background:none;overflow:hidden}
.menu{position:absolute;right:0;top:46px;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 14px 36px rgba(0,0,0,.45);z-index:40}
.menu button,.menu a{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:8px;background:none;text-align:left;text-decoration:none;font-weight:600}
.menu button:hover,.menu a:hover{background:var(--surface2)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-weight:800}
.menu .who small{display:block;color:var(--muted);font-weight:600}
.menu .sep{height:1px;background:var(--line);margin:6px 0}
.menu .red{color:#ff7b8c}
.rel{position:relative}
.banner{display:flex;gap:12px;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:700;padding:9px 16px;text-align:center}
.banner button{background:rgba(255,255,255,.2);border:0;border-radius:6px;color:#fff;padding:2px 9px}
main{padding-block:22px 90px;max-width:1280px;margin:0 auto}
.sec{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;margin:0 0 12px;letter-spacing:-.005em}
.sec button{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-size:inherit;font-weight:inherit}
.sec svg{width:18px;height:18px;color:var(--muted)}
section.blk{margin-bottom:30px}
.hrow{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow>*{scroll-snap-align:start;flex:none}
.friend{width:96px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;padding:0;text-align:center}
.friend .av{width:92px;height:92px}
.friend .fn{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friend .fs{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-5px}
.friend.add .av{display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--line)}
.friend.add .av svg{width:50%;height:50%;color:var(--fg)}
.itemcard{width:min(350px,86vw);border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ic-head{display:flex;align-items:center;gap:12px;width:100%;padding:14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.ic-thumb{width:46px;height:46px;border-radius:9px;overflow:hidden;flex:none;background:var(--surface2)}
.ic-thumb svg{width:100%;height:100%}
.ic-t{flex:1;min-width:0}
.ic-t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-t small{color:var(--muted);font-size:14px}
.ic-head>svg{width:18px;height:18px;color:var(--muted);flex:none}
.ic-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.ic-row+.ic-row{padding-top:4px}
.ic-ico{width:46px;height:46px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;background:var(--c);color:#111}
.ic-n{flex:1;min-width:0}
.ic-n b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-n .price{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}
.buy{height:40px;padding:0 20px;border-radius:8px;border:0;background:var(--surface2);font-weight:700}
.buy:hover:not(:disabled){background:color-mix(in srgb,var(--surface2) 75%,var(--fg) 25%)}
.buy:disabled{opacity:.4;cursor:not-allowed}
.recc{position:relative;width:min(310px,72vw);aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface2);text-align:left}
.recc svg{position:absolute;inset:0;width:100%;height:100%}
.recc .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-weight:700;color:#fff}
.recc .cap small{display:block;font-weight:600;opacity:.8}
.recc:hover svg{transform:scale(1.04)}
.recc svg{transition:transform .25s}
.gridg{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 14px}
.gcard{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left}
.gcard[hidden]{display:none}
.gthumb{position:relative;display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface2)}
.gthumb svg{width:100%;height:100%;transition:transform .25s}
.gcard:hover .gthumb svg{transform:scale(1.06)}
.gcard b{font-size:16px}.gcard small{color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{height:34px;padding:0 16px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
h1.pg{font-size:28px;margin:0 0 14px;font-weight:800}
.muted{color:var(--muted)}
.empty{padding:28px 0;color:var(--muted)}

/* leaderboards */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{flex:none}
.lb{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lbrow{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.lbrow:last-child{border-bottom:0}
.lbrow.me{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.rk{width:34px;font-weight:800;font-size:17px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lbrow:nth-child(1) .rk{color:#ffc83d}.lbrow:nth-child(2) .rk{color:#cfd3dc}.lbrow:nth-child(3) .rk{color:#e09a62}
.lbrow .av{width:40px;height:40px}
.lbrow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .vl{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.lbrow .vl small{display:block;color:var(--muted);font-weight:600}

/* profile */
.prof{display:grid;gap:18px;grid-template-columns:minmax(0,340px) minmax(0,1fr)}
@media(max-width:820px){.prof{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px}
.card h3{margin:0 0 12px;font-size:17px}
.pcard{text-align:center}
.pcard .av{width:130px;height:130px;margin:0 auto 12px}
.pcard h2{margin:0;font-size:24px}
.xpbar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:12px 0 6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#4aa8ff,#7ddc5a)}
.big{display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;font-weight:800;margin-top:10px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:12.5px}
.stat .gn{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:flex;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:600}
.bitem span{color:var(--muted);font-variant-numeric:tabular-nums}
.bgsw{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.bgsw button{width:40px;height:40px;border-radius:9px;border:2px solid var(--line);padding:0}
.bgsw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.bgsw input[type=color]{width:56px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:2px}

/* tab bar (phones) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--fg)}
@media(max-width:760px){
  .tabbar{display:flex}.nav{display:none}
  .topin{flex-wrap:wrap;height:auto;padding-block:8px;gap:8px 10px}
  .search{order:5;flex-basis:100%;max-width:none}
  .logo{font-size:20px}
  .pill.lv{display:none}
  h1.pg{font-size:24px}
}

/* modal + toasts */
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.mbox{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox h2{margin:0 0 10px;font-size:20px}
.mbox p{margin:0 0 10px;color:var(--muted)}
.mbox .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mbox .err{color:#ff7b8c;font-weight:600;min-height:1.2em;margin-top:8px}
.frow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow .av{width:42px;height:42px}.frow .nm{flex:1;font-weight:700}
#toasts{position:fixed;z-index:120;top:calc(env(safe-area-inset-top,0px) + 64px);right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:calc(100vw - 24px)}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .2s;display:flex;align-items:center;gap:8px}
.toast.good{border-left-color:var(--green)}.toast.bad{border-left-color:var(--red)}.toast.gold{border-left-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* player */
.player{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.phead{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.phead h2{font-size:17px;font-weight:800;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player.immersive .phead{display:none}
#unimm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 10px);z-index:80;opacity:.85}
.stage{flex:1;min-height:0;background:#000;position:relative}
.gframe{display:block;width:100%;height:100%;border:0;background:#000}
@media(max-width:560px){.phead .idea{display:none}}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- avatar editor ---------- */
.avwrap{display:grid;gap:18px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media(max-width:900px){.avwrap{grid-template-columns:minmax(0,1fr)}}
.avstage{position:relative;border:1px solid var(--line);border-radius:18px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 70%);padding:16px 10px 10px;overflow:hidden}
.avstage .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
.avstage .zav{margin-top:4px}
.avside{display:grid;gap:14px}
.colrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.colrow>b{width:52px;font-size:13px;color:var(--muted)}
.cdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.cdot[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.colrow input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:1px}
.itgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.itm{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--rc,var(--line));border-radius:12px;background:var(--surface);padding:6px 6px 8px;position:relative}

<script>
/* ===== Zoblox avatar: item catalog + blocky 3D geometry (shared by hub, server and Blox Fruits) =====
   Coordinates match the Blox Fruits character rig: origin at the feet, +y up, +z the way the character faces.
   Head centre (0,2.66,0) size .62 | torso centre (0,1.75,0) size 1 x 1.2 x .55 | arm pivots (+-.68,2.25,0) | leg pivots (+-.26,1.15,0).
   A box is [attach, colour, sx, sy, sz, x, y, z]. attach: root | armL | armR | legL | legR | arms | legs (arms/legs = both sides).
   Colour may be "$skin" "$shirt" "$pants" "$hair" (the player's own colours), optionally "col:0.7" to darken (<1) or lighten (>1). */
var ZAV = (function () {
  var SLOTS = ['hair', 'hat', 'face', 'glasses', 'neck', 'shirt', 'pants', 'shoes', 'hands', 'back'];
  var SLOT_NAMES = { hair: 'Hair', hat: 'Hats', face: 'Faces', glasses: 'Glasses', neck: 'Neck', shirt: 'Tops', pants: 'Bottoms', shoes: 'Shoes', hands: 'Hands', back: 'Back' };
  var DEFAULTS = { hair: 'hair_short', face: 'face_smile', shirt: 'top_tee', pants: 'btm_jeans', shoes: 'shoe_sneak' };
  var ITEMS = [], BY = {};
  function B(a, c, sx, sy, sz, x, y, z) { return [a, c, sx, sy, sz, x, y, z]; }
  function R(c, sx, sy, sz, x, y, z) { return ['root', c, sx, sy, sz, x, y, z]; }
  function add(id, slot, name, price, boxes, opt) {
    var it = { id: id, slot: slot, name: name, price: price, boxes: boxes || [], opt: opt || {} };
    ITEMS.push(it); BY[id] = it;
  }
  var H = '$hair';

    C.lbshow = async () => { const u = await need(a[0]); if (!u) return []; u.hidden = false; u.lbv = {}; await updateBoards(u); await saveUser(u); return [u.name + ' is back on leaderboards.']; };

      const id = (a[0] || '').toLowerCase(); if (!BOARDS[id]) return ['Boards: ' + Object.keys(BOARDS).join(' ')];

  /* ---- router ---- */
  async function handle(req) {
    const method = req.method || 'GET', path = (req.path || '/').replace(/\/+$/, '') || '/', body = req.body || {}, q = req.query || {};
    try {
      if (path === '/ping') return [200, { ok: true, mode: cfg.mode || 'server', shop: SHOP, boards: Object.keys(BOARDS).map(id => ({ id, title: BOARDS[id].title, game: BOARDS[id].game })) }];
      if (path === '/leaderboards' && method === 'GET') {
        const boards = {}; for (const id in BOARDS) boards[id] = ((await jget('lb_' + id)) || []).slice(0, 50);
        return [200, { boards }];
      }
      if (path === '/signup' && method === 'POST') {
        const name = String(body.username || '').trim(), pw = String(body.password || '');
        if (!validName(name)) return [400, { error: 'Username must be 3 to 20 letters, numbers or underscores.' }];
        if (RESERVED.some(r => name.toLowerCase().indexOf(r) >= 0)) return [400, { error: 'That username is not available.' }];
        if (pw.length < 6 || pw.length > 64) return [400, { error: 'Password must be 6 to 64 characters.' }];
        if (pw.toLowerCase() === name.toLowerCase()) return [400, { error: 'Password cannot be your username.' }];
        const em = String(body.email || '').trim().toLowerCase();
        if (em && !validEmail(em)) return [400, { error: 'That email does not look right. You can also leave it empty.' }];
        if (await getUser(name.toLowerCase())) return [409, { error: 'That username is already taken.' }];
        const salt = rand(16), u = newUser(name, salt, await pbkdf2(pw, salt, 20000), body.avatar);
        u.email = em;
        u.lastSeen = T(); await saveUser(u);
        return [200, { token: await newSession(u), me: meOf(u, await getGlob(), true) }];
      }
      if (path === '/login' && method === 'POST') {
        const u = await getUser(String(body.username || '').trim().toLowerCase());
        const bad = [401, { error: 'Incorrect username or password.' }];

      }

        if (f && f.email && !f.banned) { try { await sendResetCode(f); } catch (e) { return [502, { error: 'Could not send the email right now. Try again later.' }]; } }

      }

        const f = await getUser(String(body.username || '').trim().toLowerCase());
        const bad = [400, { error: 'That code is wrong or has expired.' }];
        const pw = String(body.password || '');
        if (pw.length < 6 || pw.length > 64) return [400, { error: 'Password must be 6 to 64 characters.' }];
        if (!f || !f.reset || f.reset.exp < T() || f.reset.tries >= 5) return bad;
        f.reset.tries++;

        f.salt = rand(16); f.hash = await pbkdf2(pw, f.salt, 20000); f.sv++; f.fails = 0; f.lockUntil = 0; f.reset = null; await saveUser(f);

      const u = A.u;
      if (path === '/logout' && method === 'POST') { u.activity = ''; u.lastSeen = 0; await saveUser(u); await kv.delete('s_' + A.token); return [200, { ok: true }]; }
      if (path === '/me' && method === 'GET') { const g = await getGlob(); return [200, { me: meOf(u, g, true), glob: globOf(g) }]; }
      if (path === '/sync' && method === 'POST') return [200, await doSync(u, body)];
      if (path === '/buy' && method === 'POST') return buy(u, body.item);
      if (path === '/live' && method === 'GET') return [200, await liveInfo(u)];
      if (path === '/poll/vote' && method === 'POST') return votePoll(u, body);
      if (path === '/avatar/buy' && method === 'POST') return buyAvatar(u, body.item);
      if (path === '/avatar/save' && method === 'POST') { await saveOutfit(u, body); return [200, { me: meOf(u, await getGlob(), false) }]; }
      if ((path === '/avatar/saved/add' || path === '/avatar/saved/delete') && method === 'POST') return savedOutfits(u, path, body);
      if (path === '/users/search' && method === 'GET') return [200, { users: await searchUsers(u, q.q) }];
      if (path === '/account/email' && method === 'POST') {
        const e = String(body.email || '').trim().toLowerCase();
        if (e && !validEmail(e)) return [400, { error: 'That does not look like an email address.' }];
        if (!eqHash(await pbkdf2(String(body.password || ''), u.salt, 20000), u.hash)) return [403, { error: 'Wrong password.' }];
        u.email = e; u.reset = null; await saveUser(u);
        return [200, { me: meOf(u, await getGlob(), false) }];
      }
      if (path === '/chats' || path.indexOf('/chat') === 0) { const r = await chatRoute(u, path, method, body, q); if (r) return r; }

      if (path === '/friends/add' && method === 'POST') {
        const n = String(body.name || '').trim().toLowerCase();
        if (!validName(n)) return [400, { error: 'Type a valid username.' }];
        if (n === u.lname) return [400, { error: 'You cannot add yourself.' }];
        const f = await getUser(n); if (!f || f.banned) return [404, { error: 'No player with that username.' }];
        if ((u.friends || []).indexOf(n) >= 0) return [400, { error: 'You already added ' + f.name + '.' }];
        if ((u.friends || []).length >= 40) return [400, { error: 'Friend list is full (40).' }];
        u.friends = (u.friends || []).concat([n]); await saveUser(u);
        return [200, { friends: await friendsList(u), me: meOf(u, await getGlob(), false) }];
      }
      if (path === '/friends/remove' && method === 'POST') {
        const n = String(body.name || '').toLowerCase(); u.friends = (u.friends || []).filter(x => x !== n); await saveUser(u);

      }

        if (u.adminLock > T()) return [429, { error: 'Locked for a while after too many wrong codes.' }];
        if (!(await hasCode(body.code))) {

          return [403, { error: 'Wrong code.' }];
        }
        u.adminFail = 0; await saveUser(u);

        return [200, { adminToken: at }];
      }

        if (path === '/admin/status' && method === 'GET') return [200, { ok: true }];
        if (path === '/admin/logout' && method === 'POST') { await kv.delete('a_' + String(req.adminToken || '')); return [200, { ok: true }]; }
        if (path === '/admin/cmd' && method === 'POST') return [200, { out: await runCommand(u, String(body.line || '').slice(0, 600)) }];

}

/* ---------------- API ---------------- */
function apiURL(path){var q='',i=path.indexOf('?');if(i>=0){q='&'+path.slice(i+1);path=path.slice(0,i)}return API_BASE+'/api?r='+encodeURIComponent(path)+q}
async function api(method,path,body,opt){
  opt=opt||{};
  if(S.mode==='local'){
    var qi=path.indexOf('?'),qs={};
    if(qi>=0){new URLSearchParams(path.slice(qi+1)).forEach(function(v,k){qs[k]=v});path=path.slice(0,qi)}
    var r=await S.core.handle({method:method,path:path,body:body||{},query:qs,token:S.token,adminToken:opt.admin?S.admin:null});
    return {ok:r.status<300,status:r.status,json:r.json};
  }
  try{
    var res=await fetch(apiURL(path),{method:method,headers:{'content-type':'application/json','authorization':'Bearer '+(S.token||''),'x-admin-token':(opt.admin?S.admin:'')||''},body:method==='GET'?undefined:JSON.stringify(body||{}),keepalive:!!opt.keepalive});
    var j={};try{j=await res.json()}catch(e){}
    return {ok:res.ok,status:res.status,json:j};
  }catch(e){return {ok:false,status:0,json:{error:'Cannot reach the server. Check your connection.'}}}
}
async function detect(){
  var last=lsGet('zoblox_mode'),why='';
  for(var i=0;i<3;i++){
    try{
      var res=await fetch(apiURL('/ping'),{cache:'no-store'}),j={};
      S.pingInfo='HTTP '+res.status+', '+((res.headers.get('content-type')||'no type').split(';')[0]);
      if(/html/.test(res.headers.get('content-type')||'')){why='noapi';break}
      try{j=await res.json()}catch(e){}
      if(res.ok&&j&&j.ok){S.mode='remote';S.shop=j.shop;lsSet('zoblox_mode','remote');lsSet('zoblox_shop',JSON.stringify(j.shop));return}
      if(j&&j.error==='KV_NOT_BOUND'){why='kv';break}
      if(res.status===404||res.status===405){why='noapi';break}
    }catch(e){S.pingInfo='no answer ('+(e&&e.message||'network error')+')'}
    await new Promise(function(r){setTimeout(r,700*(i+1))});
  }
  if(last==='remote'&&!why){
    /* the server worked before; do not silently switch to a different (empty) offline world */
    S.mode='remote';S.netdown=true;try{S.shop=JSON.parse(lsGet('zoblox_shop')||'[]')}catch(e){S.shop=[]}return;
  }
  S.mode='local';S.why=why;
  S.core=createCore(localKV(),{adminHash:ADMIN_HASH,mode:'local'});
  var r=await S.core.handle({method:'GET',path:'/ping'});S.shop=r.json.shop;
}
function offNote(){
  if(S.mode!=='local')return S.netdown?'<div class="offnote">Cannot reach the Zoblox server right now. Check your connection and refresh. Your account is safe.</div>':'';
  var t=S.why==='kv'?'The server is running but its storage is not connected yet (a KV namespace named zoblox_kv must be bound in EdgeOne). Until then accounts only exist in this browser.':
    S.why==='noapi'?'The server part of Zoblox was not found (the edge-functions folder was not uploaded), so this is offline mode: accounts only exist in this browser.':
    'Offline mode: accounts and progress are saved in this browser only.';
  return '<div class="offnote">'+t+(S.pingInfo?' <small style="opacity:.75">(test call /api?r=/ping answered: '+esc(S.pingInfo)+')</small>':'')+'</div>';
}

function startSession(j,isNew){
  S.token=j.token;lsSet('zoblox_token',j.token);
  S.me=j.me;S.saves=j.me.saves||{};delete S.me.saves;
  S.pending={xp:0,zobux:0};S.pstats={};S.pinc={goals:0,wins:0};S.pendingSave=null;S.lastSig={};
  S.lastLevel=levelOf(S.me.xp);
  var pend=null;try{pend=JSON.parse(lsGet('zoblox_pending_save')||'null')}catch(e){}
  if(pend&&pend.user===S.me.name&&pend.game&&pend.data){S.pendingSave={game:pend.game,data:pend.data};S.saves[pend.game]=pend.data}
  lsDel('zoblox_pending_save');
  if(S.me.bg)applyBg(S.me.bg);
  $('#auth').hidden=true;$('#app').hidden=false;
  S.view='home';S.q='';$('#q').value='';

  if(isNew)toast('Welcome to Zoblox, '+esc(S.me.name)+'! You start with '+COIN+' 100 Zobux.','gold',5000);

async function doSync(final){
  if(!S.token||!S.me||S.syncing)return;
  S.syncing=true;
  var sent={award:S.pending,stats:S.pstats,inc:S.pinc,save:S.pendingSave};
  S.pending={xp:0,zobux:0};S.pstats={};S.pinc={goals:0,wins:0};S.pendingSave=null;
  var body={award:sent.award,stats:sent.stats,inc:{rl:sent.inc},activity:S.activity,bg:S.pbg||undefined};
  if(sent.save)body.save=sent.save;
  var r=await api('POST','/sync',body,{keepalive:!!final});
  S.syncing=false;
  if(!r.ok){
    S.pending.xp+=sent.award.xp;S.pending.zobux+=sent.award.zobux;
    ['oe','bf'].forEach(function(g){if(sent.stats[g]&&!S.pstats[g])S.pstats[g]=sent.stats[g]});
    S.pinc.goals+=sent.inc.goals;S.pinc.wins+=sent.inc.wins;
    if(sent.save&&!S.pendingSave)S.pendingSave=sent.save;
    if(r.status===401||r.status===403){await forceLogout(r.json.error)}
    return;
  }
  S.pbg=undefined;
  var j=r.json;S.me=j.me;S.glob=j.glob||{};
  if(j.gift)giftModal(j.gift);
  var fx=JSON.stringify(S.me.fx||{});if(fx!==S.lastFx){var first=S.lastFx==='';S.lastFx=fx;pushBoosts();if(!first&&fx!=='{}')toast('Boost active: '+fxText(S.me.fx),'gold',4500)}
  var lv=levelOf(xpNow());if(lv>S.lastLevel){toast('Level up! You are now level '+lv+'.','gold');}S.lastLevel=lv;
  chrome();if(S.view==='profile')render();
}

/* ---------------- game saves per account ---------------- */
function clearKeys(id){(GAMES[id]?GAMES[id].keys:[]).forEach(lsDel)}

  var data={},any=false;
  GAMES[id].keys.forEach(function(k){var v=lsGet(k);if(v!=null){data[k]=v;any=true}});

  if(!any&&!had)return;
  var sig=JSON.stringify(data);if(sig===S.lastSig[id])return;
  S.lastSig[id]=sig;S.saves[id]=data;S.pendingSave={game:id,data:data};
}

var rewBuf={xp:0,z:0},rewT=0;
function reward(xp,z){
  if(!xp&&!z)return;
  S.pending.xp+=xp;S.pending.zobux+=z;rewBuf.xp+=xp;rewBuf.z+=z;chrome();
  clearTimeout(rewT);rewT=setTimeout(function(){
    var h=[];if(rewBuf.z)h.push(COIN+' +'+fmt(rewBuf.z)+' Zobux');if(rewBuf.xp)h.push('+'+fmt(rewBuf.xp)+' XP');
    if(h.length)toast(h.join(' &nbsp; '),'good',2600);rewBuf={xp:0,z:0};
    var lv=levelOf(xpNow());if(lv>S.lastLevel){toast('Level up! You are now level '+lv+'.','gold');S.lastLevel=lv}
  },1200);
}
function delta(key,val){var b=S.base[key];S.base[key]=val;return (b===undefined||val<b)?0:val-b}
function units(key,add,per){S.carry[key]=(S.carry[key]||0)+add;var n=Math.floor(S.carry[key]/per);S.carry[key]-=n*per;return n}
window.addEventListener('message',function(e){
  if(!S.frame||e.source!==S.frame.contentWindow)return;
  var d=e.data;if(!d||d.zoblox!==1||!S.me)return;
  if(d.event==='hello'){pushBoosts();return}
  var xp=0,z=0;
  if(d.game==='oe'&&d.stats){
    var s=d.stats,R=REW.oe;
    var dp=delta('oe.picks',s.picks||0);xp+=units('oe.px',dp,R.pickXp);z+=units('oe.pz',dp,R.pickZ);
    var dt=delta('oe.tier',s.tier||0);xp+=dt*R.tier[0];z+=dt*R.tier[1];
    var dr=delta('oe.reb',s.rebirths||0);xp+=dr*R.reb[0];z+=dr*R.reb[1];
    var dg=delta('oe.gold',s.golden||0);xp+=dg*R.gold[0];z+=dg*R.gold[1];
    S.pstats.oe={picks:s.picks||0,tier:s.tier||0,rebirths:s.rebirths||0};
  }else if(d.game==='bf'&&d.stats){
    var b=d.stats,Rb=REW.bf;
    var dl=delta('bf.lvl',b.level||1);xp+=dl*Rb.lvl[0];z+=dl*Rb.lvl[1];
    var dk=delta('bf.kills',b.kills||0);xp+=units('bf.kx',dk,Rb.killXp);z+=units('bf.kz',dk,Rb.killZ);
    S.pstats.bf={level:b.level||1,kills:b.kills||0};
  }else if(d.game==='rl'&&!d.training&&(d.mode==='1v1'||d.mode==='2v2')){
    if(d.event==='goal'&&d.team===0){xp+=REW.rl.goal[0];z+=REW.rl.goal[1];S.pinc.goals++}
    if(d.event==='end'&&d.won){xp+=REW.rl.win[0];z+=REW.rl.win[1];S.pinc.wins++}
  }
  reward(xp,z);
});

    el.innerHTML='<div class="grid"><div class="card"><h3>Money and levels</h3><p class="sub">Applied to your own account.</p><div class="row" style="margin-top:0"><button class="pbtn mint" data-c="cheat money">Infinite Zobux</button><button class="pbtn" data-c="cheat unlock">Unlock all avatar items</button></div>'+

     '<label>Custom</label><div class="cline" style="margin-top:0"><input id="cn" type="number" value="25" min="1"><button class="pbtn sm lav" data-a="clev">Add levels</button><button class="pbtn sm" data-a="cxp">Add XP</button></div></div>'+
     '<div class="card"><h3>Overpower the leaderboards</h3><p class="sub">Only admins can do this. Your rank updates right away.</p><button class="pbtn peach" data-c="cheat top">Rank #1 on every board</button>'+
     '<label>Set one board</label><select id="cb"><option value="xp">Most XP</option><option value="oe_picks">Orchard clicks</option><option value="oe_tier">Orchard evolution (1 to 30)</option><option value="bf_level">Blox Fruits level</option><option value="rl_goals">Rocket League goals</option><option value="rl_wins">Rocket League wins</option></select><label>Value</label><input id="cv" type="number" value="1000000" min="0"><div class="row"><button class="pbtn sm rose" data-a="cboard">Set my value</button></div></div></div>'+
     '<div class="card" style="margin-top:14px"><h3>Game cheats</h3><p class="sub">Flip them on or off. They stay on until you turn them off.</p>'+T.map(function(x){return '<div class="tgl"><span class="tx"><b>'+x[1]+'</b><small>'+x[2]+'</small></span><button class="sw" role="switch" aria-checked="'+(!!on[x[0]])+'" aria-label="'+x[1]+'" data-a="ctog" data-t="'+x[0]+'" data-on="'+(on[x[0]]?1:0)+'"></button></div>'}).join('')+'<div class="row"><button class="pbtn sm mint" data-c="cheat all">Everything on</button><button class="pbtn sm" data-c="cheat off">Everything off</button></div></div>'+

function aprint(text,cls){var o=$('#aout');if(!o)return;var d=document.createElement('div');d.className='l '+(cls||'');d.textContent=text;o.appendChild(d);o.scrollTop=o.scrollHeight}
function aprintHTML(html){var o=$('#aout');if(!o)return;var d=document.createElement('div');d.innerHTML=html;o.appendChild(d);o.scrollTop=Math.max(0,d.offsetTop-12)}
async function refreshMe(){var r=await api('GET','/me');if(r.ok){var p=S.pending;S.me=r.json.me;S.pending=p;S.glob=r.json.glob||S.glob;var fx=JSON.stringify(S.me.fx||{});S.lastFx=fx;pushBoosts();chrome()}}
async function runCmd(line){
  ahist.push(line);hidx=ahist.length;
  if(atabNow!=='console'&&!$('#aout')){atab('console')}
  aprint('> '+line,'cmd');
  var w=line.trim().split(/\s+/),c0=w[0].toLowerCase();
  if(c0==='help'||c0==='?'){aprintHTML(helpHTML(w.slice(1).join(' ')));return}
  if(c0==='clear'){var o=$('#aout');if(o)o.innerHTML='';return}
  var r=await api('POST','/admin/cmd',{line:line},{admin:true});
  if(!r.ok){aprint(r.json.error||'Command failed.','bad');if(r.status===403||r.status===401){S.admin=null;lsDel('zoblox_admin');chrome()}return}
  (r.json.out||[]).forEach(function(l){aprint(l,/^(Unknown|No player|Usage|Give a|Type)/.test(l)?'bad':'')});
  if(/^(cheat|give|take|set|addlevels|grantitem|boost|unboost|resetstats)/i.test(line))await refreshMe();
  if(c0==='cheat'&&atabNow==='cheats'){var keep=$('#aout')?$('#aout').innerHTML:'';atab('cheats');if($('#aout'))$('#aout').innerHTML=keep}
}


/* ---------------- live: admin say + poll ---------------- */
var sayTimer=0,pollSig='';
function showSay(m){
  var box=$('#saybox');clearTimeout(sayTimer);
  box.innerHTML='<div class="saycard" role="status"><span class="badge">ADMIN</span><span class="tx"><small>'+esc(m.by)+'</small><b>'+esc(m.msg)+'</b></span><span class="bar"><i></i></span></div>';
  box.hidden=false;sayTimer=setTimeout(function(){box.hidden=true;box.innerHTML=''},5000);
}
function drawPoll(p){
  var box=$('#pollbox');
  if(!p||S.pollGone===p.id){box.hidden=true;box.innerHTML='';pollSig='';return}
  var sig=p.id+'|'+p.mine+'|'+(p.counts||[]).join(',');
  if(sig===pollSig&&!box.hidden)return;pollSig=sig;
  var tot=p.counts?p.counts[0]+p.counts[1]:0;
  var opts=p.opts.map(function(o,i){
    if(p.mine===null||p.mine===undefined)return '<button class="popt" data-a="vote" data-p="'+esc(p.id)+'" data-c="'+i+'"><span>'+esc(o)+'</span></button>';
    var n=p.counts[i],pc=tot?Math.round(n/tot*100):0;
    return '<button class="popt'+(p.mine===i?' mine':'')+'" data-a="vote" data-p="'+esc(p.id)+'" data-c="'+i+'"><i class="fill" style="width:'+pc+'%"></i><span><b>'+esc(o)+(p.mine===i?' (your vote)':'')+'</b><em style="font-style:normal">'+pc+'% · '+n+'</em></span></button>';
  }).join('');
  box.innerHTML='<div class="pollcard"><div class="ph"><small>Poll from '+esc(p.by)+'</small><button data-a="pollx" data-p="'+esc(p.id)+'" aria-label="Hide poll">&times;</button></div><h4>'+esc(p.q)+'</h4>'+opts+'<div class="ft">'+(p.mine===null||p.mine===undefined?'Pick one. You can change your vote.':'Thanks for voting. You can change your vote.')+'</div></div>';
  box.hidden=false;
}
async function pollLive(){
  if(!S.me||document.hidden)return;
  var r=await api('GET','/live');if(!r.ok)return;
  var j=r.json;
  if(j.say&&j.say.id!==S.lastSay&&j.now-j.say.t<15000){S.lastSay=j.say.id;showSay(j.say)}
  drawPoll(j.poll);
}
async function votePoll(pid,c,btn){
  var r=await api('POST','/poll/vote',{id:pid,choice:c});
  if(!r.ok){toast(esc(r.json.error||'Could not vote.'),'bad');pollLive();return}
  pollSig='';pollLive();
}

/* ---------------- events ---------------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a],[data-q],[data-c]');
  if(!e.target.closest('.rel')||e.target.closest('#menu'))$('#menu').hidden=true;
  if(!t)return;
  if(t.hasAttribute('data-c')&&!t.hasAttribute('data-a')){runCmd(t.getAttribute('data-c'));return}
  if(t.hasAttribute('data-q')){var u=$('#qu')&&$('#qu').value.trim(),n=$('#qn')&&$('#qn').value;var q=t.getAttribute('data-q');
    if(/^(give|take)/.test(q)){if(!u){aprint('Type a player name first.','bad');return}runCmd(q+' '+u+' '+n)}else runCmd(q);return}
  var a=t.getAttribute('data-a');
  switch(a){
    case 'go':go(t.getAttribute('data-v'));break;
    case 'signup':authForm('signup');break;case 'login':authForm('login');break;case 'authhome':authHome();break;
    case 'terms':legal('terms');break;case 'privacy':legal('privacy');break;case 'closem':closeModal();break;
    case 'play':openGame(t.getAttribute('data-g'));break;
    case 'buy':buyItem(t.getAttribute('data-i'),t);break;
    case 'friends':friendModal();break;
    case 'addfr':(async function(){var n=$('#fname').value.trim();if(!n)return;var r=await api('POST','/friends/add',{name:n});if(!r.ok){$('#ferr').textContent=r.json.error||'Could not add.';return}S.friends=r.json.friends;S.me=r.json.me;render();friendModal()})();break;
    case 'rmfr':(async function(){var r=await api('POST','/friends/remove',{name:t.getAttribute('data-n')});if(r.ok){S.friends=r.json.friends;S.me=r.json.me;render();friendModal()}})();break;
    case 'gtag':S.gtag=t.getAttribute('data-t');render();break;
    case 'lbtab':S.lbBoard=t.getAttribute('data-b');render();break;
    case 'bg':setBg(t.getAttribute('data-c'));break;
    case 'avcolor':S.me.avatar=t.getAttribute('data-c');S.pavatar=S.me.avatar;api('POST','/sync',{avatar:S.me.avatar}).then(function(){render()});chrome();render();break;
    case 'logout':logout();break;
    case 'avslot':avSlot=t.getAttribute('data-s');avTabs();avGrid();break;
    case 'avitem':equip(t.getAttribute('data-i'));break;
    case 'avcol':S.me.outfit[t.getAttribute('data-k')]=t.getAttribute('data-c');outfitChanged(true);break;
    case 'avreset':S.me.outfit=ZAV.defaultOutfit();outfitChanged(true);break;
    case 'avsave':(async function(){var r=await api('POST','/avatar/saved/add',{name:$('#svname').value,outfit:S.me.outfit});if(!r.ok){toast(esc(r.json.error||'Could not save.'),'bad');return}S.me.saved=r.json.me.saved;$('#svname').value='';avSaved();toast('Look saved.','good')})();break;
    case 'avload':(function(){var sv=(S.me.saved||[])[+t.getAttribute('data-i')];if(sv){S.me.outfit=ZAV.clean(sv.outfit,S.me.owned||[]);outfitChanged(true)}})();break;
    case 'avdel':(async function(){var r=await api('POST','/avatar/saved/delete',{index:+t.getAttribute('data-i')});if(r.ok){S.me.saved=r.json.me.saved;avSaved()}})();break;
    case 'avbuy':avBuy(t.getAttribute('data-i'));break;
    case 'newdm':newDMModal();break;case 'newgroup':newGroupModal();break;
    case 'dmgo':dmGo($('#dmn').value);break;case 'dmpick':dmGo(t.getAttribute('data-n'));break;
    case 'dm':closeModal();dmGo(t.getAttribute('data-n'));break;
    case 'grpgo':grpGo();break;case 'addmem':addMemModal();break;
    case 'amgo':(async function(){var r=await api('POST','/chat/add',{id:S.cur.id,name:$('#amn').value});if(!r.ok){$('#amerr').textContent=r.json.error||'Could not add.';return}closeModal();pullChat(false);loadChats()})();break;
    case 'leavegrp':(async function(){if(!S.cur)return;var r=await api('POST','/chat/leave',{id:S.cur.id});if(r.ok){S.cur=null;await loadChats();render()}})();break;
    case 'openchat':openChat(t.getAttribute('data-id'));break;
    case 'chatback':S.cur=null;var cw=$('#chatwrap');if(cw)cw.classList.remove('open');chatList();break;
    case 'addfrn':(async function(){var n=t.getAttribute('data-n'),r=await api('POST','/friends/add',{name:n});if(!r.ok){toast(esc(r.json.error||'Could not add.'),'bad');return}S.friends=r.json.friends;S.me.friends=r.json.me.friends;toast('Added '+esc(n)+' as a friend.','good');t.outerHTML='<span class="muted">Friends</span>'})();break;
    case 'forgot':forgotForm();break;
    case 'hpick':atab('console');$('#acmd').value=t.getAttribute('data-x');$('#acmd').focus();break;
    case 'ctog':runCmd('cheat '+t.getAttribute('data-t')+(t.getAttribute('data-on')==='1'?' off':''));break;
    case 'clev':runCmd('cheat levels '+($('#cn').value||1));break;
    case 'cxp':runCmd('cheat xp '+($('#cn').value||1000));break;
    case 'cboard':(function(){var b=$('#cb').value,v=Math.max(0,Math.floor(+$('#cv').value||0)),me=S.me.name;
      var map={xp:'set xp '+me+' '+v,oe_picks:'setstat '+me+' oe.picks '+v,oe_tier:'setstat '+me+' oe.tier '+Math.max(0,v-1),bf_level:'setstat '+me+' bf.level '+v,rl_goals:'setstat '+me+' rl.goals '+v,rl_wins:'setstat '+me+' rl.wins '+v};runCmd(map[b])})();break;
    case 'dismissann':lsSet('zoblox_ann',t.getAttribute('data-id'));chrome();break;
    case 'admin':if(S.admin)adminOpen();else adminPrompt();break;
    case 'adminunlock':adminUnlock();break;
    case 'adminlogout':adminLogout();break;
    case 'vote':votePoll(t.getAttribute('data-p'),+t.getAttribute('data-c'),t);break;
    case 'pollx':S.pollGone=t.getAttribute('data-p');drawPoll(null);break;
    case 'qsay':(function(){var m=$('#sm').value.trim();if(!m){aprint('Type a message first.','bad');return}runCmd('say '+m)})();break;
    case 'qpoll':(function(){var q=$('#pq').value.trim().replace(/"/g,"'"),a=$('#pa').value.trim().replace(/"/g,"'"),b=$('#pb').value.trim().replace(/"/g,"'");if(!q||!a||!b){aprint('Fill in the question and both options.','bad');return}runCmd('poll "'+q+'" "'+a+'" "'+b+'" minutes='+($('#pm').value||5))})();break;
    case 'adminclose':clearInterval(aclock);$('#adminLayer').hidden=true;break;
    case 'atab':atab(t.getAttribute('data-t'));break;
    case 'pinfo':atab('console');runCmd('info '+t.getAttribute('data-n'));break;
    case 'pban':atab('console');$('#acmd').value='ban '+t.getAttribute('data-n')+' ';$('#acmd').focus();break;
    case 'punban':atab('console');runCmd('unban '+t.getAttribute('data-n'));break;
    case 'qboost':(function(){var u=$('#bu').value.trim();if(!u){aprint('Type a player name or all.','bad');return}var ty=$('#bt').value,m=$('#bm').value,d=$('#bd').value;runCmd('boost '+u+' '+ty+' '+m+' '+(+d===0?'perm':d))})();break;
    case 'qunboost':(function(){var u=$('#bu').value.trim();if(!u){aprint('Type a player name or all.','bad');return}runCmd('unboost '+u+' '+$('#bt').value)})();break;
    case 'qgift':runCmd('gift '+$('#gz').value+' xp='+$('#gx').value+' hours='+$('#gh').value+' msg="'+$('#gm').value.replace(/"/g,"'")+'"');break;
    case 'qann':(function(){var m=$('#am').value.trim();if(!m){aprint('Type a message.','bad');return}runCmd('announce '+$('#amin').value+' '+m)})();break;
  }
});
$('#avbtn').addEventListener('click',function(e){
  e.stopPropagation();var m=$('#menu');
  if(!m.hidden){m.hidden=true;return}
  m.innerHTML='<div class="who">'+esc(S.me.name)+'<small>Level '+levelOf(xpNow())+' · '+fmt(bal())+' Zobux</small></div><button data-a="go" data-v="profile">Profile</button><button data-a="go" data-v="lb">Leaderboards</button><a href="'+FORM_URL+'" target="_blank" rel="noopener noreferrer">Send an idea</a><button data-a="admin">Admin panel</button>'+(S.admin?'<button data-a="adminlogout">Log out of admin</button>':'')+'<div class="sep"></div><button class="red" data-a="logout">Log out</button>';

});
document.addEventListener('input',function(e){
  if(e.target.id==='bgcustom')setBg(e.target.value);
  if(e.target.matches&&e.target.matches('input[type=color][data-k]')){S.me.outfit[e.target.getAttribute('data-k')]=e.target.value;outfitChanged(false)}
